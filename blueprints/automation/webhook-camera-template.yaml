# webhook-camera-template.yaml
#
# Home Assistant package template for a camera webhook that receives JSON with a
# base64 `snapshot`, writes one latest image file, and updates a template sensor.
#
# Install:
# 1. Copy this file to /config/packages/webhook-camera-template.yaml
# 2. Replace the values marked CHANGE_ME.
# 3. Keep webhook_id secret; it is the only authentication for this endpoint.
# 4. Restart Home Assistant after adding the package.
#
# Webhook URL:
# https://YOUR_HOME_ASSISTANT_URL/api/webhook/CHANGE_ME_WEBHOOK_ID
#
# Notes:
# - `local_only: true` is the safer default for LAN/Nabu Casa access.
# - Set `local_only: false` only when this webhook must be triggered directly
#   from the internet.
# - JSON requests must use Content-Type: application/json for `trigger.json`.

command_line:
  - notify:
      name: webhook_camera_snapshot_writer
      command: "sh -c 'mkdir -p /config/www/tmp && base64 -d > /config/www/tmp/webhook_camera_latest.jpg'"

template:
  - triggers:
      - trigger: event
        event_type: webhook_camera_event
    sensor:
      - name: Webhook Camera
        unique_id: webhook_camera
        default_entity_id: sensor.webhook_camera
        icon: mdi:cctv
        picture: "{{ trigger.event.data.snapshot_url | default('/local/tmp/webhook_camera_latest.jpg', true) }}"
        state: "{{ trigger.event.data.event | default('unknown', true) }}"
        attributes:
          device: "{{ trigger.event.data.device | default('', true) }}"
          time: "{{ trigger.event.data.time | default('', true) }}"
          resolution_w: "{{ trigger.event.data.resolution_w | int(0) }}"
          resolution_h: "{{ trigger.event.data.resolution_h | int(0) }}"
          detection_region: "{{ trigger.event.data.detection_region | int(0) }}"
          coordinate_x1: "{{ trigger.event.data.coordinate_x1 | int(0) }}"
          coordinate_y1: "{{ trigger.event.data.coordinate_y1 | int(0) }}"
          coordinate_x2: "{{ trigger.event.data.coordinate_x2 | int(0) }}"
          coordinate_y2: "{{ trigger.event.data.coordinate_y2 | int(0) }}"
          snapshot_path: "{{ trigger.event.data.snapshot_path | default('/config/www/tmp/webhook_camera_latest.jpg', true) }}"
          snapshot_url: "{{ trigger.event.data.snapshot_url | default('/local/tmp/webhook_camera_latest.jpg', true) }}"
          snapshot_bytes_base64: "{{ trigger.event.data.snapshot_bytes_base64 | int(0) }}"
          received_at: "{{ trigger.event.data.received_at | default(now().isoformat(), true) }}"

automation:
  - id: webhook_camera_webhook
    alias: Webhook Camera
    description: Receive a camera webhook, store the latest snapshot, and update a sensor.
    triggers:
      - trigger: webhook
        webhook_id: CHANGE_ME_WEBHOOK_ID
        allowed_methods:
          - POST
        local_only: false
    conditions: []
    actions:
      - variables:
          payload: "{{ trigger.json | default({}, true) }}"
          snapshot_base64: "{{ payload.snapshot | default('', true) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ snapshot_base64 | length > 0 }}"
            sequence:
              - action: notify.webhook_camera_snapshot_writer
                data:
                  message: "{{ snapshot_base64 }}"
      - event: webhook_camera_event
        event_data:
          event: "{{ payload.event | default('', true) }}"
          device: "{{ payload.device | default('', true) }}"
          time: "{{ payload.time | default('', true) }}"
          resolution_w: "{{ payload.resolution_w | default(0, true) }}"
          resolution_h: "{{ payload.resolution_h | default(0, true) }}"
          detection_region: "{{ payload.detection_region | default(0, true) }}"
          coordinate_x1: "{{ payload.coordinate_x1 | default(0, true) }}"
          coordinate_y1: "{{ payload.coordinate_y1 | default(0, true) }}"
          coordinate_x2: "{{ payload.coordinate_x2 | default(0, true) }}"
          coordinate_y2: "{{ payload.coordinate_y2 | default(0, true) }}"
          snapshot_path: /config/www/tmp/webhook_camera_latest.jpg
          snapshot_url: /local/tmp/webhook_camera_latest.jpg
          snapshot_bytes_base64: "{{ snapshot_base64 | length }}"
          received_at: "{{ now().isoformat() }}"
    mode: single
